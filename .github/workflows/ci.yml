name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the API code compiles
        run: python -m py_compile api/app.py
      - name: Check docker-compose.yml is valid
        run: docker compose config --quiet
